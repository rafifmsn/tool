server {
    listen 80;
    server_name localhost;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://api.github.com https://cdn.jsdelivr.net https://raw.githubusercontent.com https://cloudflareinsights.com https://static.cloudflareinsights.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com;" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Support fallback to 404.html for client-side redirection resolution
        try_files $uri $uri/ /404.html;
    }

    # Custom 404 handler
    error_page 404 /404.html;
}
